name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --verbose
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings

  # Builds the app as a release does (release-dmg.yml), signed ad hoc, so a change that breaks the
  # release build fails here first.
  build:
    # The runner and Xcode release-dmg.yml builds with, so the toolchain here is the release's.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version && swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-universal-cargo-${{ hashFiles('Cargo.lock') }}
      - run: ./packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-macos-universal
          path: dist/Sutra-*.dmg
