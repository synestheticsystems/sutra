[package]
name = "sutra"
version = "0.1.6"
edition = "2024"
description = "The Rust core of Sutra, a Mac app that maps every worktree and project folder with its agents, dev environments and disk use, and cleans its build folders"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.85"

[workspace]
members = ["ffi", "ffi/bindgen"]

[dependencies]
notify = "7"
dirs = "6"
nix = { version = "0.29", features = ["dir", "fs", "signal", "process", "user"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Cargo's own hash for `{workspace-path-hash}` in `build.build-dir`, so Sutra finds the folder
# cargo would.
rustc-stable-hash = "0.1.2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The SwiftUI window reads the dashboard through bindings UniFFI generates.
uniffi = "0.32.2"

[target.'cfg(target_os = "macos")'.dependencies]
rodio = { version = "0.21", features = ["symphonia-aiff"] }
tts = "0.26"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSURL",
] }
